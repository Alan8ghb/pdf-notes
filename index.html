<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const $=id=>document.getElementById(id);
let strokes=[],drawMode=false,eraseMode=false,undoStack=[],penColor='#e53935',defaults=JSON.parse(localStorage.getItem('pdfnotes:defaults')||'{"fontSize":20,"color":"#333333"}');
// one-time migration: old built-in default 13 -> new built-in default 20 (per-note sizes untouched)
if(!localStorage.getItem('pdfnotes:defaultsV2')){if(defaults.fontSize===13){defaults.fontSize=20;localStorage.setItem('pdfnotes:defaults',JSON.stringify(defaults))}localStorage.setItem('pdfnotes:defaultsV2','1')}
const pad2=v=>String(v).padStart(2,'0');
function fmtDate(t,withTime){if(!t)return '—';const d=new Date(t);if(isNaN(d))return '—';return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())+(withTime?' '+pad2(d.getHours())+':'+pad2(d.getMinutes()):'')}
function pdfDate(sv){try{const d=sv&&pdfjsLib.PDFDateString.toDateObject(sv);return d&&!isNaN(d)?d.getTime():undefined}catch(e){return undefined}}
let rangeBytes=0,curFile=null,pageProxies=[],baseVps=[],io=null,rendered=new Map(),saveWarned=false;
let pdf=null,bytes=null,fileName='',key='',scale=1,notes=[],pageViews=[],adding=false,editing=null,pendingNew=null;
// notes: {id,page,x,y (PDF top-left),w,h,text,fontSize,color,created,modified (ms timestamps; may be missing for old notes)}

// ===EXPORT-START===
async function buildAnnotatedPdf(srcBytes, notes, PDFLib, strokes, opts){
  strokes=strokes||[];opts=opts||{};
  const hex2rgb=h=>{h=(h||'#000000').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');return [0,2,4].map(i=>Math.round(parseInt(h.substr(i,2),16)/255*1000)/1000)};
  const {PDFDocument,PDFName,PDFHexString,PDFString,PDFArray}=PDFLib;
  const doc=await PDFDocument.load(srcBytes,{ignoreEncryption:true});
  const pages=doc.getPages();
  // remove existing Text annotations (they were loaded as notes) to avoid duplicates
  pages.forEach(p=>{
    const annots=p.node.lookup(PDFName.of('Annots'));
    if(!(annots instanceof PDFArray))return;
    for(let i=annots.size()-1;i>=0;i--){
      const a=annots.lookup(i);
      const st=a&&a.get&&a.get(PDFName.of('Subtype'));if(st===PDFName.of('Text')||st===PDFName.of('Ink')||st===PDFName.of('FreeText'))annots.remove(i);
    }
  });
  for(const n of notes){
    const p=pages[n.page-1]; if(!p)continue;
    const w=n.w||140,h=n.h||70,fs=n.fontSize||13,c=hex2rgb(n.color||'#333333'),rect=[n.x,n.y-h,n.x+w,n.y];
    const dict={
      Type:'Annot',Subtype:'FreeText',Rect:rect,
      Contents:PDFHexString.fromText(n.text||''),
      DA:PDFString.of(`/Helv ${fs} Tf ${c.join(' ')} rg`),DS:PDFString.of(`font: ${fs}pt sans-serif; color: ${n.color||'#333333'}`),
      T:PDFHexString.fromText(n.author||'Alan'),NM:PDFHexString.fromText(n.id),F:4,
      BS:{Type:'Border',W:0.5,S:'S'},IC:[1,0.973,0.784],
      PNR_FontSize:fs,PNR_Color:PDFHexString.fromText(n.color||'')
    };
    if(n.created)dict.CreationDate=PDFString.fromDate(new Date(n.created));
    if(n.modified||n.created)dict.M=PDFString.fromDate(new Date(n.modified||n.created));
    if(opts.noteImage){ // appearance = pre-rendered image of the box (handles CJK without embedding a font)
      const png=await opts.noteImage(n,w,h); if(png){ const img=await doc.embedPng(png);
        // empty BT/ET carries font size + color so readers (e.g. pdf.js) can recover them from the appearance
        const ap=doc.context.stream(`BT /Helv ${fs} Tf ${c.join(" ")} rg ET q ${w} 0 0 ${h} ${rect[0]} ${rect[1]} cm /Im0 Do Q`,{Type:'XObject',Subtype:'Form',BBox:rect,Resources:{XObject:{Im0:img.ref},Font:{Helv:{Type:'Font',Subtype:'Type1',BaseFont:'Helvetica',Encoding:'WinAnsiEncoding'}}}});
        dict.AP={N:doc.context.register(ap)}; } }
    const annot=doc.context.obj(dict);
    p.node.addAnnot(doc.context.register(annot));
  }
  for(const k of strokes){
    const p=pages[k.page-1]; if(!p||!k.points||k.points.length<2)continue;
    const w=k.width||2,op=k.opacity==null?1:k.opacity,c=hex2rgb(k.color);
    const xs=k.points.map(q=>q[0]),ys=k.points.map(q=>q[1]);
    const rect=[Math.min(...xs)-w,Math.min(...ys)-w,Math.max(...xs)+w,Math.max(...ys)+w];
    const f=v=>(+v).toFixed(2);
    const ops=`q /GS0 gs ${c.map(f).join(' ')} RG ${f(w)} w 1 J 1 j `+k.points.map((q,i)=>`${f(q[0])} ${f(q[1])} ${i?'l':'m'}`).join(' ')+' S Q';
    const gs=doc.context.obj({Type:'ExtGState',CA:op,ca:op});
    const ap=doc.context.stream(ops,{Type:'XObject',Subtype:'Form',BBox:rect,Resources:{ExtGState:{GS0:gs}}});
    const annot=doc.context.obj({
      Type:'Annot',Subtype:'Ink',Rect:rect,InkList:[k.points.flat()],C:c,CA:op,F:4,
      BS:{Type:'Border',W:w,S:'S'},NM:PDFHexString.fromText(k.id||''),T:PDFHexString.fromText('Alan'),
      M:PDFString.fromDate(new Date(k.created||Date.now())),AP:{N:doc.context.register(ap)}
    });
    p.node.addAnnot(doc.context.register(annot));
  }
  return await doc.save();
}
// ===EXPORT-END===

// render a note box (background, border, wrapped + clamped text) to PNG for the PDF appearance stream
async function noteToPng(n,w,h){
  const k=3,c=document.createElement('canvas');c.width=Math.ceil(w*k);c.height=Math.ceil(h*k);const g=c.getContext('2d');
  g.fillStyle='rgba(255,248,200,0.8)';g.fillRect(0,0,c.width,c.height);g.strokeStyle='rgba(184,138,0,0.6)';g.lineWidth=k;g.strokeRect(k/2,k/2,c.width-k,c.height-k);
  const fs=(n.fontSize||13)*k,lh=fs*1.3,pad=3*k,maxW=c.width-2*pad,dfs=Math.max(6*k,fs*0.6),dh=dfs*1.3;
  g.font=`${dfs}px system-ui,sans-serif`;g.fillStyle='#888';g.textBaseline='top';g.fillText(fmtDate(n.modified||n.created),pad,pad);
  const top=pad+dh,maxL=Math.max(1,Math.floor((c.height-top-pad)/lh));
  g.font=`${fs}px system-ui,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif`;g.fillStyle=n.color||'#333';g.textBaseline='top';
  const lines=[];let over=false;
  for(const para of String(n.text||'').split('\n')){let cur='';
    for(const ch of Array.from(para)){if(g.measureText(cur+ch).width>maxW&&cur){lines.push(cur);cur=ch}else cur+=ch}
    lines.push(cur); if(lines.length>maxL){over=true;break}}
  if(lines.length>maxL){over=true;lines.length=maxL}
  if(over){let last=lines[maxL-1]||'';while(last&&g.measureText(last+'…').width>maxW)last=Array.from(last).slice(0,-1).join('');lines[maxL-1]=last+'…'}
  lines.forEach((t,i)=>g.fillText(t,pad,top+i*lh+(lh-fs)/2));
  const b=await new Promise(r=>c.toBlob(r,'image/png'));c.width=c.height=0;return new Uint8Array(await b.arrayBuffer());
}
function showError(msg){let o=document.getElementById('errbox');if(!o){o=document.createElement('div');o.id='errbox';
  o.style.cssText='position:fixed;z-index:99;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));background:#fff3f3;color:#900;border:1px solid #e99;border-radius:8px;padding:10px 12px;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.3);white-space:pre-wrap;max-height:40vh;overflow:auto';
  o.onclick=()=>o.remove();document.body.appendChild(o)}o.textContent='⚠ '+msg+'\n（点此关闭；如反复出现，可尝试缩小页面或重新打开文件）';setStatus('⚠ 出错了')}
addEventListener('error',e=>showError('程序错误：'+(e.message||e.error)));
addEventListener('unhandledrejection',e=>{const m=e.reason&&(e.reason.message||e.reason);if(e.reason&&e.reason.name==='RenderingCancelledException')return;showError('程序错误：'+m)});
function setStatus(s){$('status').textContent=s}
function uid(){return 'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function save(){ if(!key)return; try{localStorage.setItem(key,JSON.stringify({notes,strokes},(k,v)=>k==='_orig'?undefined:v))}catch(e){setStatus('⚠ 保存失败：存储空间不足');if(!saveWarned){saveWarned=true;alert('浏览器存储空间不足，笔记未能自动保存。请用 📁 导出笔记 JSON 备份，或删除部分画线。')}} }

async function openFile(f){
  if(!f)return; if(!/pdf$/i.test(f.type)&&!/\.pdf$/i.test(f.name)){alert('请选择 PDF 文件');return}
  if(pdf){releaseAll();try{await pdf.destroy()}catch(e){} pdf=null}
  curFile=f; fileName=f.name; key='pdfnotes:'+f.name+':'+f.size; setStatus('正在打开…');
  // range loading straight from the File: only the bytes pdf.js needs are read; no full copy in the page
  const tr=new pdfjsLib.PDFDataRangeTransport(f.size,null);
  tr.requestDataRange=(b,e)=>{rangeBytes+=e-b;f.slice(b,e).arrayBuffer().then(buf=>tr.onDataRange(b,new Uint8Array(buf)),err=>showError('读取文件失败：'+err.message))};
  try{pdf=await pdfjsLib.getDocument({range:tr,length:f.size,disableAutoFetch:true,disableStream:true,rangeChunkSize:65536,
      isOffscreenCanvasSupported:false,maxImageSize:MOBILE?1.6e7:4e7,canvasMaxAreaInBytes:MOBILE?6e7:2e8,stopAtErrors:false}).promise}
  catch(e){showError('无法打开 PDF：'+e.message);return}
  pageProxies=[];baseVps=[];const p1=await pdf.getPage(1);pageProxies[1]=p1;baseVps[1]=p1.getViewport({scale:1});
  const stored=localStorage.getItem(key);
  undoStack=[];if(stored){const j=JSON.parse(stored);notes=Array.isArray(j)?j:(j.notes||[]);strokes=Array.isArray(j)?[]:(j.strokes||[])}else{const r=await loadExistingAnnots();notes=r.notes;strokes=r.strokes;save()}
  ['add','draw','exp','ejson'].forEach(i=>$(i).disabled=false);
  $('drop').style.display='none';
  await fitWidth();
  setStatus(`${fileName} · ${pdf.numPages} 页 · ${notes.length} 条笔记 · ${strokes.length} 条画线`+(stored?'（已恢复）':''));
}
async function loadExistingAnnots(){
  const out=[],ink=[],toHex=c=>c&&c.length>=3?'#'+[0,1,2].map(i=>(c[i]|0).toString(16).padStart(2,'0')).join(''):null;

function clampS(s){return Math.max(0.3,Math.min(4,s))}

async function setScale(ns,cx,cy){ if(!pdf)return; ns=clampS(ns); const r=ns/scale; if(Math.abs(r-1)<0.001){$('pages').style.transform='';return}
  const box=$('pages'),b=box.getBoundingClientRect(); box.style.transform='';
  const ax=scrollX+cx-(b.left+scrollX), ay=scrollY+cy-(b.top+scrollY); // point within #pages (untransformed)
  scale=ns; await render();
  quietScroll=Date.now()+600;
  const nb=box.getBoundingClientRect(); window.scrollTo(Math.max(0,ax*r+nb.left+scrollX-cx),Math.max(0,ay*r+nb.top+scrollY-cy)); }
let zoomTimer=null,pendZoom=1;
function zoom(f){ if(!pdf)return; pendZoom=clampS(scale*pendZoom*f)/scale; const box=$('pages'),b=box.getBoundingClientRect(),cx=innerWidth/2,cy=innerHeight/2;
  box.style.transformOrigin=(cx-b.left)+'px '+(cy-b.top)+'px'; box.style.transform='scale('+pendZoom+')'; $('zl').textContent=Math.round(scale*pendZoom*100)+'%';
  clearTimeout(zoomTimer); zoomTimer=setTimeout(()=>{const z=pendZoom;pendZoom=1;$('pages').style.transformOrigin='0 0';setScale(scale*z,cx,cy)},300); }
// two-finger pinch on content only
let pinch=null;
const tdist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
document.addEventListener('touchstart',e=>{ if(!pdf||e.touches.length!==2||e.target.closest('#tb,.menu,#side,#pop'))return;
  cancelStroke&&cancelStroke(); const t=e.touches,box=$('pages'),b=box.getBoundingClientRect();
  const cx=(t[0].clientX+t[1].clientX)/2,cy=(t[0].clientY+t[1].clientY)/2;
  pinch={d0:tdist(t),cx,cy,s:1}; box.style.transformOrigin=(cx-b.left)+'px '+(cy-b.top)+'px'; e.preventDefault(); },{passive:false});
document.addEventListener('touchmove',e=>{ if(!pinch)return; e.preventDefault(); if(e.touches.length<2)return;
  pinch.s=clampS(scale*tdist(e.touches)/pinch.d0)/scale; $('pages').style.transform='scale('+pinch.s+')'; $('zl').textContent=Math.round(scale*pinch.s*100)+'%'; },{passive:false});
document.addEventListener('touchend',e=>{ if(!pinch||e.touches.length>=2)return; const p=pinch;pinch=null; $('pages').style.transformOrigin='0 0'; setScale(scale*p.s,p.cx,p.cy); });
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());
$('zin').onclick=()=>zoom(1.2); $('zout').onclick=()=>zoom(1/1.2); $('zfit').onclick=()=>pdf&&fitWidth();
$('file').onchange=e=>{openFile(e.target.files[0]);e.target.value=''};
['dragenter','dragover'].forEach(t=>document.addEventListener(t,e=>{e.preventDefault();document.body.classList.add('drag')}));
['dragleave','drop'].forEach(t=>document.addEventListener(t,e=>{e.preventDefault();if(t==='drop'||e.target===document.documentElement||!e.relatedTarget)document.body.classList.remove('drag')}));
document.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f)openFile(f)});
function download(data,name,type){const u=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),5000)}
$('exp').onclick=async()=>{ try{ setStatus('正在导出…'); const out=await buildAnnotatedPdf(new Uint8Array(await curFile.arrayBuffer()),notes,PDFLib,strokes,{noteImage:noteToPng});
  download(out,fileName.replace(/\.pdf$/i,'')+'_带笔记.pdf','application/pdf'); setStatus('已导出 '+notes.length+' 条笔记、'+strokes.length+' 条画线'); }catch(e){alert('导出失败：'+e.message)} };
$('ejson').onclick=()=>download(JSON.stringify({app:'pdf-notes-reader',file:fileName,key,exported:new Date().toISOString(),notes,strokes},null,2),fileName.replace(/\.pdf$/i,'')+'_笔记.json','application/json');
$('ijson').onchange=async e=>{ const f=e.target.files[0]; e.target.value=''; if(!f)return;
  if(!pdf){alert('请先打开对应的 PDF');return}
  try{ const j=JSON.parse(await f.text()); const arr=Array.isArray(j)?j:j.notes; if(!Array.isArray(arr))throw new Error('格式不正确');
    if(j.file&&j.file!==fileName&&!confirm(`该备份来自「${j.file}」，仍要导入到当前文件？`))return;
    const replace=confirm('点“确定”替换现有笔记，点“取消”合并到现有笔记');
    const valid=arr.filter(n=>n&&typeof n.page==='number'&&typeof n.x==='number'&&typeof n.y==='number').map(n=>({...n,id:n.id||uid(),text:String(n.text||'')}));
    if(replace)notes=valid;else{const ids=new Set(notes.map(n=>n.id));valid.forEach(n=>{if(!ids.has(n.id))notes.push(n)})}
    const ks=(Array.isArray(j)?[]:(j.strokes||[])).filter(k=>k&&typeof k.page==='number'&&Array.isArray(k.points)&&k.points.length>1).map(k=>({...k,id:k.id||uid()}));
    if(replace)strokes=ks;else{const ids=new Set(strokes.map(k=>k.id));ks.forEach(k=>{if(!ids.has(k.id))strokes.push(k)})}
    save(); for(let i=1;i<=pdf.numPages;i++){drawMarkers(i);drawStrokes(i)} renderList(); setStatus('已导入 '+valid.length+' 条笔记、'+ks.length+' 条画线');
  }catch(err){alert('导入失败：'+err.message)} };

// ---- slim toolbar UI ----
const menus=['mFile','mNote','mDraw','mZoom'];
function closeMenus(){menus.forEach(m=>$(m).classList.remove('show'));document.querySelectorAll('.ib.open').forEach(b=>b.classList.remove('open'))}
document.querySelectorAll('.ib[data-m]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const m=$(b.dataset.m),was=m.classList.contains('show');closeMenus();
  if(!was){m.classList.add('show');b.classList.add('open');const r=b.getBoundingClientRect();m.style.left=Math.max(6,Math.min(r.left,innerWidth-m.offsetWidth-6))+'px'}}));
menus.forEach(m=>$(m).addEventListener('click',e=>e.stopPropagation()));
document.addEventListener('click',()=>closeMenus());
['add','exp','ejson','zfit'].forEach(id=>$(id).addEventListener('click',()=>setTimeout(closeMenus,0)));
$('draw').addEventListener('click',()=>setTimeout(closeMenus,0));
$('file').addEventListener('change',closeMenus);$('ijson').addEventListener('change',closeMenus);
function openSide(){closeMenus();$('side').classList.add('open');$('shade').classList.add('show')}
function closeSide(){$('side').classList.remove('open');$('shade').classList.remove('show')}
$('bList').onclick=e=>{e.stopPropagation();$('side').classList.contains('open')?closeSide():openSide()};
$('shade').onclick=closeSide;$('sideX').onclick=closeSide;
const updDot=()=>{$('penDot').style.color=penColor};updDot();
$('pal').addEventListener('click',()=>setTimeout(updDot,0));$('ccol').addEventListener('input',updDot);
// auto-hide toolbar
let lastY=scrollY,quietScroll=0;
addEventListener('scroll',()=>{const y=scrollY,d=y-lastY;if(Date.now()<quietScroll||pinch){lastY=y;return}
  if(y<40||d<-6)document.body.classList.remove('tbhide');
  else if(d>6&&!document.querySelector('.menu.show')&&$('pop').style.display!=='block')document.body.classList.add('tbhide');
  if(Math.abs(d)>6)lastY=y},{passive:true});
$('pages').addEventListener('click',()=>{if(!adding&&!drawMode&&!eraseMode&&document.body.classList.contains('tbhide'))document.body.classList.remove('tbhide')});
// fullscreen
const fsEl=document.documentElement,canFs=fsEl.requestFullscreen||fsEl.webkitRequestFullscreen;
if(!canFs)$('bFull').style.display='none';
$('bFull').onclick=()=>{const cur=document.fullscreenElement||document.webkitFullscreenElement;
  if(cur)(document.exitFullscreen||document.webkitExitFullscreen).call(document);else{const p=canFs.call(fsEl);p&&p.catch&&p.catch(()=>{})}};
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
$('ptxt').addEventListener('input',autoGrow);
</script></body></html>
